<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עדן ויקיר – החתונה</title>
<meta property="og:title" content="הוזמנתם לחתונה של עדן ויקיר">
<meta property="og:description" content="יום שני, 16 בנובמבר, צל החורש, בית ברל">
<meta property="og:image" content="invite.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Bellefair&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F3EE;
    --paper-2:#E9E8E1;
    --sage:#6E8468;
    --ink:#34473A;
    --line:#C9D0C3;
    --night:#223027;
    --seal:#56704F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Frank Ruhl Libre','David','Times New Roman',serif;
    font-size:18px;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% 0%, #34473A 0%, var(--night) 60%, #1A241D 100%);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .script{font-family:'Bellefair','Frank Ruhl Libre',serif;font-weight:400}

  /* ============ INTRO: envelope ============ */
  .intro{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
    padding:24px;
    transition:opacity .9s ease, visibility .9s;
  }
  .intro.gone{opacity:0;visibility:hidden}
  .intro-lead{color:#DCE2D6;text-align:center}
  .intro-lead .script{font-size:2.6rem;line-height:1;display:block;color:var(--paper)}
  .intro-lead p{font-style:italic;font-size:1.05rem;opacity:.8;margin-top:8px}

  .envelope{
    position:relative;
    width:min(360px, 86vw);
    aspect-ratio:3/2;
    perspective:1200px;
  }
  .env-back,.env-front,.flap,.letter{position:absolute;left:0;width:100%}
  .env-back{inset:0;height:100%;background:var(--paper-2);border-radius:4px;box-shadow:0 30px 50px -20px rgba(0,0,0,.6)}
  .letter{
    left:6%;width:88%;top:8%;height:84%;
    background:var(--paper);
    border-radius:2px;
    z-index:1;
    display:flex;align-items:center;justify-content:center;
    transition:transform 1s cubic-bezier(.3,.8,.3,1) .7s;
  }
  .letter::after{content:"";position:absolute;inset:8px;border:1px solid var(--line)}
  .letter .script{font-size:2rem;color:var(--ink)}
  .env-front{
    inset:0;height:100%;z-index:2;
    background:linear-gradient(160deg,#EFEEE8,#E4E3DB);
    clip-path:polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
    border-radius:4px;
  }
  .env-front::before{ /* fine inner stroke */
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top right, transparent calc(50% - .5px), rgba(52,71,58,.12) 50%, transparent calc(50% + .5px)) left/50% 100% no-repeat,
               linear-gradient(to top left, transparent calc(50% - .5px), rgba(52,71,58,.12) 50%, transparent calc(50% + .5px)) right/50% 100% no-repeat;
  }
  .flap{
    top:0;height:60%;z-index:3;
    background:linear-gradient(180deg,#E8E7E0,#DEDDD5);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transition:transform .8s cubic-bezier(.5,0,.3,1), z-index 0s .4s;
  }
  .seal{
    position:absolute;left:50%;top:60%;z-index:4;
    width:78px;height:78px;margin:-39px 0 0 -39px;
    border:0;background:none;cursor:pointer;border-radius:50%;
    transition:transform .4s ease, opacity .4s ease;
  }
  .seal svg{width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
  .seal:hover{transform:scale(1.05)}
  .seal:focus-visible{outline:2px solid var(--paper);outline-offset:6px}
  .seal-ring{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .open .seal{opacity:0;transform:scale(.6);pointer-events:none}
  .open .flap{transform:rotateX(180deg);z-index:0}
  .open .letter{transform:translateY(-58%)}

  .intro-hint{color:#C9D3C4;font-style:italic;font-size:1rem;display:flex;align-items:center;gap:8px}
  .intro-hint svg{width:16px;height:16px}

  /* ============ INVITATION ============ */
  .stage{
    min-height:100%;
    display:flex;justify-content:center;
    padding:40px 16px 110px;
    opacity:0;transform:translateY(24px) scale(.98);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
  }
  .stage.in{opacity:1;transform:none}

  .card{
    position:relative;
    width:100%;max-width:540px;
    background:var(--paper);
    box-shadow:0 40px 70px -30px rgba(0,0,0,.65);
    padding:78px 44px 60px;
    text-align:center;
    overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none}
  .card::after{content:"";position:absolute;inset:19px;border:.5px solid var(--line);opacity:.6;pointer-events:none}

  .corner{position:absolute;width:132px;height:132px;pointer-events:none}
  .corner.tl{top:2px;left:2px}
  .corner.tr{top:2px;right:2px;transform:scaleX(-1)}
  .corner.bl{bottom:2px;left:2px;transform:scaleY(-1)}
  .corner.br{bottom:2px;right:2px;transform:scale(-1,-1)}

  .lead{font-style:italic;font-size:1.35rem;color:var(--sage);letter-spacing:.02em}
  .names{font-size:clamp(3.2rem, 14vw, 4.6rem);line-height:1.15;margin:14px 0 4px;color:var(--ink)}
  .names .amp{font-family:'Frank Ruhl Libre',serif;font-style:italic;font-size:.5em;color:var(--sage);margin:0 .15em;vertical-align:.18em}

  .toast{display:block;width:120px;height:88px;margin:18px auto 0}
  .toast .g{transform-box:fill-box}

  .datebar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    margin:34px auto 0;max-width:380px;
  }
  .datebar .side{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;font-size:1.05rem}
  .datebar .mid{padding:0 22px;line-height:1}
  .datebar .mid .num{display:block;font-size:3.6rem;font-weight:400}
  .datebar .mid .mon{display:block;font-style:italic;font-size:1.1rem;color:var(--sage);margin-top:4px}
  .year{font-size:.95rem;letter-spacing:.3em;color:var(--sage);margin-top:14px}

  .sprig{display:block;width:90px;height:18px;margin:34px auto}

  .place{font-size:1.3rem}
  .town{font-style:italic;color:var(--sage);font-size:1.15rem}

  .links{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 26px;margin-top:14px}
  .link{
    font:inherit;font-size:1rem;color:var(--ink);background:none;border:0;cursor:pointer;
    text-decoration:none;padding:2px 0;
    border-bottom:1px solid var(--line);
    transition:border-color .2s, color .2s;
  }
  .link:hover{border-bottom-color:var(--ink)}
  .link:focus-visible{outline:2px solid var(--sage);outline-offset:4px}

  .countdown{display:flex;justify-content:center;gap:0;margin-top:4px}
  .countdown div{padding:0 18px;border-inline-start:1px solid var(--line)}
  .countdown div:first-child{border-inline-start:0}
  .countdown b{display:block;font-weight:400;font-size:2.1rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .countdown span{font-style:italic;font-size:.9rem;color:var(--sage)}
  .soon{font-style:italic;color:var(--sage)}

  .rsvp h2{font-size:2.7rem;line-height:1.1}
  .rsvp .sub{font-style:italic;color:var(--sage);margin-bottom:22px}
  .field{margin:0 auto 18px;max-width:280px}
  .field input{
    width:100%;font:inherit;font-size:1.1rem;color:var(--ink);text-align:center;
    background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 2px;
  }
  .field input::placeholder{color:#9AA696;font-style:italic}
  .field input:focus{outline:none;border-bottom-color:var(--ink)}
  .choice{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .opt{
    font:inherit;font-size:1.02rem;color:var(--ink);cursor:pointer;
    background:transparent;border:1px solid var(--line);padding:8px 20px;
    transition:all .2s;
  }
  .opt:hover{border-color:var(--sage)}
  .opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .opt:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
  .stepper{direction:ltr;display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
  .stepper .opt{width:36px;height:36px;padding:0}
  .stepper output{font-size:1.6rem;min-width:30px;display:block;line-height:1}
  .stepper small{font-style:italic;color:var(--sage);font-size:.9rem}
  .err{color:#8A5040;font-style:italic;font-size:.95rem;min-height:1.5em}
  .send{
    font:inherit;font-size:1.1rem;letter-spacing:.04em;cursor:pointer;
    background:var(--ink);color:var(--paper);border:0;padding:12px 30px;margin-top:4px;
    transition:background .2s;
  }
  .send:hover{background:var(--sage)}
  .send:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
  .thanks{display:none;font-size:1.25rem;font-style:italic}
  .thanks.show{display:block}

  /* ============ player ============ */
  .player{
    position:fixed;left:50%;bottom:18px;z-index:20;
    transform:translate(-50%, 20px);opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:12px;
    padding:8px 18px 8px 8px;border-radius:999px;
    background:rgba(34,48,39,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--paper);font-size:.98rem;font-style:italic;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:opacity .6s ease 1.4s, transform .6s ease 1.4s;
  }
  .player.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .player[hidden]{display:none}
  .pbtn{
    width:36px;height:36px;border-radius:50%;border:1px solid rgba(244,243,238,.4);
    background:transparent;color:var(--paper);cursor:pointer;display:grid;place-items:center;
  }
  .pbtn:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  .pbtn svg{width:14px;height:14px}
  .eq{display:flex;align-items:flex-end;gap:2px;height:14px}
  .eq i{width:2px;background:var(--paper);height:30%;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.2s}
  .eq i:nth-child(3){animation-delay:.4s}
  .eq i:nth-child(4){animation-delay:.1s}
  .paused .eq i{animation-play-state:paused}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}

  @media (max-width:440px){
    body{font-size:18px}
    .card{padding:66px 26px 48px}
    .corner{width:92px;height:92px}
    .countdown div{padding:0 10px}
    .datebar .mid{padding:0 14px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
  }
  /* Hebrew: no faux italics */
  body, body *{font-style:normal!important}
  .side,.num,.year,.countdown b{unicode-bidi:isolate}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="lf" d="M0 0 C 5 -5.5, 13 -5.5, 19 0 C 13 5.5, 5 5.5, 0 0 Z"/>
    <symbol id="branch" viewBox="0 0 130 130">
      <g fill="#6E8468" fill-opacity=".18" stroke="#6E8468" stroke-width=".9">
        <path d="M6 6 C 40 24, 74 58, 108 118" fill="none" stroke-width="1"/>
        <use href="#lf" transform="translate(18 12) rotate(-12)"/>
        <use href="#lf" transform="translate(20 13) rotate(78)"/>
        <use href="#lf" transform="translate(36 22) rotate(-4)"/>
        <use href="#lf" transform="translate(38 24) rotate(86)"/>
        <use href="#lf" transform="translate(54 36) rotate(6)"/>
        <use href="#lf" transform="translate(56 38) rotate(96)"/>
        <use href="#lf" transform="translate(70 52) rotate(16)"/>
        <use href="#lf" transform="translate(72 55) rotate(104)"/>
        <use href="#lf" transform="translate(85 70) rotate(26)"/>
        <use href="#lf" transform="translate(86 74) rotate(110)"/>
        <use href="#lf" transform="translate(106 116) rotate(-120)"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- ============ INTRO ============ -->
<div class="intro" id="intro">
  <div class="intro-lead">
    <span class="script">עדן ויקיר</span>
    <p>רוצים לשתף אתכם במשהו מרגש</p>
  </div>

  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="letter"><span class="script">ע &amp; י</span></div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="פתיחת ההזמנה">
      <svg viewBox="0 0 80 80" aria-hidden="true">
        <defs>
          <radialGradient id="wax" cx="40%" cy="35%" r="70%">
            <stop offset="0" stop-color="#7C9575"/>
            <stop offset=".6" stop-color="#56704F"/>
            <stop offset="1" stop-color="#3E5439"/>
          </radialGradient>
        </defs>
        <g class="seal-ring" style="transform-origin:40px 40px">
          <path d="M40 3 C 50 2, 58 7, 64 11 C 71 16, 77 25, 77 36 C 78 46, 75 56, 69 64 C 62 72, 52 78, 40 77 C 28 78, 17 73, 10 65 C 4 57, 2 47, 3 38 C 4 26, 10 16, 18 10 C 25 5, 32 3, 40 3 Z" fill="url(#wax)"/>
          <circle cx="40" cy="40" r="27" fill="none" stroke="#F4F3EE" stroke-opacity=".45" stroke-width="1"/>
          <text x="40" y="49" text-anchor="middle" font-family="Bellefair, Frank Ruhl Libre, serif" font-size="24" fill="#F4F3EE" fill-opacity=".92">ע&amp;י</text>
        </g>
      </svg>
    </button>
  </div>

  <p class="intro-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    לחצו על החותם לפתיחה
  </p>
</div>

<!-- ============ INVITATION ============ -->
<div class="stage" id="stage" aria-hidden="true">
  <main class="card">
    <svg class="corner tl" aria-hidden="true"><use href="#branch"/></svg>
    <svg class="corner tr" aria-hidden="true"><use href="#branch"/></svg>
    <svg class="corner bl" aria-hidden="true"><use href="#branch"/></svg>
    <svg class="corner br" aria-hidden="true"><use href="#branch"/></svg>

    <p class="lead">שמחים להזמינכם לחגוג איתנו את חתונתנו</p>
    <h1 class="names script">עדן <span class="amp">&amp;</span> יקיר</h1>

    <!-- fine-line coupe glasses -->
    <svg class="toast" viewBox="0 0 120 88" aria-hidden="true" fill="none" stroke="#34473A" stroke-width="1" stroke-linecap="round">
      <path d="M56 6 v7 M48 9 l3 5 M64 9 l-3 5" stroke="#6E8468"/>
      <g transform="rotate(14 40 50)">
        <path d="M18 26 Q 40 32 62 24 Q 60 50 42 52 Q 20 52 18 26 Z"/>
        <path d="M21 34 Q 40 38 59 32" stroke="#6E8468"/>
        <circle cx="58" cy="26" r="5" stroke="#6E8468"/>
        <path d="M41 52 L 39 80 M29 82 Q 39 79 49 82"/>
      </g>
      <g transform="rotate(-14 80 50)">
        <path d="M58 24 Q 80 32 102 26 Q 100 52 78 52 Q 60 50 58 24 Z"/>
        <path d="M61 32 Q 80 38 99 34" stroke="#6E8468"/>
        <circle cx="62" cy="26" r="5" stroke="#6E8468"/>
        <path d="M79 52 L 81 80 M71 82 Q 81 79 91 82"/>
      </g>
    </svg>

    <div class="datebar">
      <span class="side">יום שני</span>
      <span class="mid"><span class="num">16</span><span class="mon">נובמבר</span></span>
      <span class="side">19:30</span>
    </div>
    <p class="year">2026</p>

    <svg class="sprig" viewBox="0 0 90 18" aria-hidden="true" fill="#6E8468" fill-opacity=".2" stroke="#6E8468" stroke-width=".8">
      <path d="M4 9 H86" fill="none"/>
      <use href="#lf" transform="translate(30 9) rotate(-30) scale(.7)"/>
      <use href="#lf" transform="translate(30 9) rotate(210) scale(.7)"/>
      <use href="#lf" transform="translate(60 9) rotate(30) scale(.7)"/>
      <use href="#lf" transform="translate(60 9) rotate(-210) scale(.7)"/>
    </svg>

    <p class="place">אולם צל החורש</p>
    <p class="town">בית ברל</p>
    <div class="links">
      <a class="link" id="waze" target="_blank" rel="noopener">ניווט בוויז</a>
      <a class="link" id="gmaps" target="_blank" rel="noopener">פתיחה בגוגל מפות</a>
    </div>

    <svg class="sprig" viewBox="0 0 90 18" aria-hidden="true"><use href="#sprig-dup"/></svg>

    <div id="countdown" class="countdown" role="timer" aria-label="הזמן שנותר עד החתונה">
      <div><b id="cd-d">0</b><span>ימים</span></div>
      <div><b id="cd-h">0</b><span>שעות</span></div>
      <div><b id="cd-m">0</b><span>דקות</span></div>
    </div>
    <div class="links">
      <a class="link" id="gcal" target="_blank" rel="noopener">הוספה ליומן גוגל</a>
      <button class="link" id="ics">הוספה ליומן אפל או אאוטלוק</button>
    </div>

    <svg class="sprig" viewBox="0 0 90 18" aria-hidden="true" fill="#6E8468" fill-opacity=".2" stroke="#6E8468" stroke-width=".8">
      <path d="M4 9 H86" fill="none"/>
      <use href="#lf" transform="translate(45 9) rotate(-35) scale(.8)"/>
      <use href="#lf" transform="translate(45 9) rotate(215) scale(.8)"/>
    </svg>

    <section class="rsvp">
      <h2 class="script">אישור הגעה</h2>
      <p class="sub">נשמח לתשובתכם עד 6 בנובמבר</p>

      <div id="rsvp-form">
        <div class="field">
          <input id="guest" autocomplete="name" placeholder="השם שלך" aria-label="השם שלך">
        </div>
        <div class="choice" role="group" aria-label="הגעה">
          <button class="opt" data-att="yes" aria-pressed="false">נגיע בשמחה</button>
          <button class="opt" data-att="no" aria-pressed="false">לא נוכל להגיע</button>
        </div>
        <div class="stepper" id="stepper" style="visibility:hidden">
          <button class="opt" id="minus" aria-label="פחות אורחים">−</button>
          <div><output id="count">1</output><small>אורחים</small></div>
          <button class="opt" id="plus" aria-label="יותר אורחים">+</button>
        </div>
        <p class="err" id="err"></p>
        <button class="send" id="send">שליחת אישור בוואטסאפ</button>
      </div>
      <p class="thanks" id="thanks"></p>
    </section>
  </main>
</div>

<!-- ============ PLAYER ============ -->
<audio id="track" src="track.mp3" loop preload="auto"></audio>
<div class="player" id="player">
  <button class="pbtn" id="pbtn" aria-label="השהיית המוזיקה">
    <svg id="icon-pause" viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2" width="2.6" height="10"/><rect x="8.4" y="2" width="2.6" height="10"/></svg>
    <svg id="icon-play" viewBox="0 0 14 14" fill="currentColor" style="display:none"><path d="M4 2 L12 7 L4 12 Z"/></svg>
  </button>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span>השיר שלנו</span>
</div>

<script>
  /* ===== Event details: edit here ===== */
  const EVENT = {
    title:    "החתונה של עדן ויקיר",
    start:    "2026-11-16T19:30:00+02:00",  // reception time: confirm
    startUTC: "20261116T173000Z",
    endUTC:   "20261116T230000Z",   // assumed until 01:00
    address:  "צל החורש בית ברל",
    addressEn:"אולם צל החורש, בית ברל",
    whatsapp: ""                    // e.g. "972501234567"; empty = guest picks a contact
  };

  // reuse the first sprig for the second divider
  const firstSprig = document.querySelector('.sprig');
  const dup = document.querySelectorAll('.sprig')[1];
  dup.replaceWith(firstSprig.cloneNode(true));

  /* ----- open sequence ----- */
  const intro = document.getElementById('intro');
  const envelope = document.getElementById('envelope');
  const stage = document.getElementById('stage');
  const audio = document.getElementById('track');
  const player = document.getElementById('player');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let audioOk = true;

  audio.addEventListener('error', () => { audioOk = false; player.hidden = true; });

  document.getElementById('seal').addEventListener('click', () => {
    envelope.classList.add('open');
    if (audioOk){
      audio.volume = 0;
      audio.play().then(fadeIn).catch(() => setPaused(true));
      player.classList.add('show');
    }
    setTimeout(() => {
      intro.classList.add('gone');
      stage.classList.add('in');
      stage.removeAttribute('aria-hidden');
      window.scrollTo(0,0);
    }, reduce ? 50 : 1900);
  });

  function fadeIn(){
    let v = 0;
    const t = setInterval(() => { v = Math.min(1, v + .05); audio.volume = v; if (v >= 1) clearInterval(t); }, 90);
  }

  /* ----- player ----- */
  const pbtn = document.getElementById('pbtn');
  function setPaused(p){
    player.classList.toggle('paused', p);
    document.getElementById('icon-pause').style.display = p ? 'none' : '';
    document.getElementById('icon-play').style.display  = p ? '' : 'none';
    pbtn.setAttribute('aria-label', p ? 'ניגון המוזיקה' : 'השהיית המוזיקה');
  }
  pbtn.addEventListener('click', () => {
    if (audio.paused){ audio.play(); setPaused(false); }
    else { audio.pause(); setPaused(true); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !audio.paused){ audio.pause(); setPaused(true); }
  });

  /* ----- links ----- */
  const q = encodeURIComponent(EVENT.address);
  document.getElementById('waze').href  = `https://waze.com/ul?q=${q}&navigate=yes`;
  document.getElementById('gmaps').href = `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('gcal').href =
    `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(EVENT.title)}` +
    `&dates=${EVENT.startUTC}/${EVENT.endUTC}&location=${encodeURIComponent(EVENT.addressEn)}`;

  document.getElementById('ics').addEventListener('click', () => {
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//EdenYakir//Invite//EN','BEGIN:VEVENT',
      'UID:eden-yakir-wedding-20261116','DTSTAMP:20260915T000000Z',
      'DTSTART:'+EVENT.startUTC,'DTEND:'+EVENT.endUTC,
      'SUMMARY:'+EVENT.title,'LOCATION:'+EVENT.addressEn.replace(/,/g,'\\,'),
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
    a.download = 'eden-yakir-wedding.ics';
    document.body.appendChild(a); a.click(); a.remove();
  });

  /* ----- countdown ----- */
  const target = new Date(EVENT.start).getTime();
  const cd = document.getElementById('countdown');
  function tick(){
    const diff = target - Date.now();
    if (diff <= 0){ cd.innerHTML = '<p class="soon">החגיגה התחילה</p>'; return clearInterval(timer); }
    const m = Math.floor(diff/60000);
    document.getElementById('cd-d').textContent = Math.floor(m/1440);
    document.getElementById('cd-h').textContent = Math.floor(m%1440/60);
    document.getElementById('cd-m').textContent = m%60;
  }
  const timer = setInterval(tick, 20000); tick();

  /* ----- RSVP ----- */
  let attending = null, count = 1;
  const out = document.getElementById('count');
  const stepper = document.getElementById('stepper');
  const err = document.getElementById('err');

  document.querySelectorAll('[data-att]').forEach(b => b.addEventListener('click', () => {
    attending = b.dataset.att === 'yes';
    document.querySelectorAll('[data-att]').forEach(x => x.setAttribute('aria-pressed', x === b));
    stepper.style.visibility = attending ? 'visible' : 'hidden';
    err.textContent = '';
  }));
  document.getElementById('minus').onclick = () => { count = Math.max(1, count-1); out.textContent = count; };
  document.getElementById('plus').onclick  = () => { count = Math.min(10, count+1); out.textContent = count; };

  document.getElementById('send').addEventListener('click', () => {
    const name = document.getElementById('guest').value.trim();
    if (!name){ err.textContent = 'נא להוסיף שם כדי שנדע מי אישר.'; return; }
    if (attending === null){ err.textContent = 'נא לבחור אם תגיעו.'; return; }
    const msg = attending
      ? `היי עדן ויקיר! כאן ${name}. נגיע בשמחה (${count===1?'אורח אחד':count+' אורחים'}). מזל טוב! 🥂`
      : `היי עדן ויקיר! כאן ${name}. לצערנו לא נוכל להגיע, שולחים המון אהבה. מזל טוב! 🤍`;
    const base = EVENT.whatsapp ? `https://wa.me/${EVENT.whatsapp}` : 'https://wa.me/';
    window.open(`${base}?text=${encodeURIComponent(msg)}`, '_blank');
    document.getElementById('rsvp-form').style.display = 'none';
    const t = document.getElementById('thanks');
    t.textContent = attending ? `תודה ${name}! נתראה בחתונה.` : `תודה ${name}, נתגעגע.`;
    t.classList.add('show');
  });
</script>
</body>
</html>
